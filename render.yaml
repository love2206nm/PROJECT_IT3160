services:
  - type: web
    name: ai-career-copilot
    runtime: docker
    plan: starter  # 1 GB RAM / 1 vCPU recommended to comfortably fit O*NET In-memory store & FAISS
    region: singapore  # Closest region for low latency to Vietnam
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FAST_LLM_PROVIDER
        value: deepseek
      - key: FAST_LLM_MODEL
        value: deepseek-chat
      - key: REASONING_LLM_MODEL
        value: gemini-1.5-pro
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      # Secret API Keys to be populated in Render Dashboard
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
