version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: job-advisor:latest
    container_name: job_advisor_fullstack
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - HOST=0.0.0.0
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
